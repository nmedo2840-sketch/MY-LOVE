<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basbosty ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:'Cairo',sans-serif;
    background:
    radial-gradient(circle at center,
    #6a0019 0%,
    #3d0010 35%,
    #1a0007 100%);
    display:flex;
    justify-content:center;
    color:white;
    position:relative;
}

/* 🌹 الخلفية */
body::before{
    content:'';
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle,#ff4f8b55 1px,transparent 1px);
    background-size:60px 60px;
    opacity:0.25;
    animation:bgmove 20s linear infinite;
}

@keyframes bgmove{
    from{transform:translateY(0);}
    to{transform:translateY(-80px);}
}

/* 💖 القلوب المنتشرة */
.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    color:#ff8ab5;
    opacity:0.8;
    animation:float linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(0) scale(0.8);
        opacity:0;
    }
    10%{opacity:1;}
    100%{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}

/* 📦 المحتوى */
.container{
    position:relative;
    z-index:5;
    width:95%;
    max-width:1100px;
    text-align:center;
    padding-top:40px;
}

/* 💕 الاسم */
.logo{
    font-family:'Great Vibes',cursive;
    font-size:110px;
    color:#ffbdd5;
    text-shadow:0 0 10px #ff4f8b,
                0 0 20px #ff4f8b,
                0 0 40px #ff4f8b;
}

.line{
    width:420px;
    height:3px;
    margin:auto;
    background:linear-gradient(to right,transparent,#ff8ab5,transparent);
    margin-bottom:30px;
}

/* 🕒 */
.title{
    font-size:70px;
    font-weight:bold;
    color:#ffd8e6;
    text-shadow:0 0 20px #ff4f8b;
}

.subtitle{
    font-size:22px;
    color:#ffd8e6;
    margin-top:10px;
}

/* ⏳ العداد */
.counter{
    margin-top:40px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
}

.box{
    width:170px;
    padding:25px;
    border-radius:30px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
}

.number{
    font-size:60px;
    font-weight:bold;
    color:#ff9dc1;
}

.label{
    font-size:22px;
    color:#ffd8e6;
}

/* 💌 */
.message{
    margin-top:40px;
    padding:15px 40px;
    border-radius:50px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    font-size:26px;
    color:#ffd8e6;
}

/* 📱 */
@media(max-width:768px){
.logo{font-size:60px;}
.title{font-size:45px;}
.box{width:140px;}
.number{font-size:45px;}
.line{width:250px;}
.message{font-size:20px;}
}

</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container">

    <div class="logo">Basbosty ❤️</div>
    <div class="line"></div>

    <div class="title">
        من يوم 25/3/2026 <br>
        وإلى مالا نهاية ♾️
    </div>

    <div class="subtitle">❤️ كل ثانية بتقربني ليكي أكتر ❤️</div>

    <div class="counter">

        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">أيام</div>
        </div>

        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">ساعات</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">دقائق</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">ثواني</div>
        </div>

    </div>

    <div class="message">
        كل يوم بيزيد حبي ليكي أكتر من اللي قبله 💖
    </div>

</div>

<script>

/* ⏳ العداد */
const startDate = new Date("2026-03-25T00:00:00");

function updateCounter(){
    let now = new Date();
    let diff = now - startDate;
    if(diff < 0) diff = 0;

    document.getElementById("days").innerText =
    Math.floor(diff / (1000*60*60*24));

    document.getElementById("hours").innerText =
    Math.floor((diff % (1000*60*60*24)) / (1000*60*60));

    document.getElementById("minutes").innerText =
    Math.floor((diff % (1000*60*60)) / (1000*60));

    document.getElementById("seconds").innerText =
    Math.floor((diff % (1000*60)) / 1000);
}

setInterval(updateCounter,1000);
updateCounter();

/* 💖 قلوب في كل الشاشة */
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";

    heart.style.left = Math.random()*100 + "vw";
    heart.style.top = Math.random()*100 + "vh";
    heart.style.fontSize = (Math.random()*25 + 10) + "px";
    heart.style.animationDuration = (Math.random()*6 + 4) + "s";

    document.getElementById("hearts").appendChild(heart);

    setTimeout(()=>heart.remove(),10000);
}

setInterval(createHeart,200);

</script>

</body>
</html>
