<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basbosty ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    font-family:'Cairo',sans-serif;
}

/* 🎬 دخول أنيميشن (سينمائي) */
body{
    background:
    radial-gradient(circle at center,
    #6a0019 0%,
    #3d0010 35%,
    #1a0007 100%);

    color:white;
    display:flex;
    justify-content:center;
    align-items:flex-start;

    opacity:0;
    transform:scale(1.05);
    animation:fadeIn 1.5s ease forwards;
}

@keyframes fadeIn{
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* 🌹 ورود ساقطة */
.fall-roses{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

.rose{
    position:absolute;
    top:-50px;
    font-size:20px;
    animation:fall linear infinite;
    opacity:0.8;
}

@keyframes fall{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }
    10%{opacity:1;}
    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

/* 💖 القلوب */
.hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    color:#ff8ab5;
    animation:float linear infinite;
}

@keyframes float{
    0%{transform:translateY(0) scale(0.8);opacity:0;}
    10%{opacity:1;}
    100%{transform:translateY(-120vh) scale(1.5);opacity:0;}
}

/* 📦 المحتوى */
.container{
    position:relative;
    z-index:5;
    width:100%;
    max-width:1100px;
    text-align:center;
    padding:40px 10px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

/* 💕 الاسم */
.logo{
    font-family:'Great Vibes',cursive;
    font-size:clamp(45px,8vw,110px);
    color:#ffbdd5;
    text-shadow:0 0 10px #ff4f8b,
                0 0 20px #ff4f8b,
                0 0 40px #ff4f8b;
}

/* خط */
.line{
    width:clamp(180px,60vw,420px);
    height:3px;
    background:linear-gradient(to right,transparent,#ff8ab5,transparent);
}

/* 🕒 */
.title{
    font-size:clamp(28px,5vw,70px);
    font-weight:bold;
    color:#ffd8e6;
    text-shadow:0 0 20px #ff4f8b;
}

.subtitle{
    font-size:clamp(14px,3vw,22px);
    color:#ffd8e6;
}

/* ⏳ العداد */
.counter{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.box{
    width:clamp(120px,22vw,180px);
    padding:20px;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.15);
}

.number{
    font-size:clamp(30px,6vw,65px);
    color:#ff9dc1;
}

.label{
    font-size:clamp(14px,3vw,24px);
    color:#ffd8e6;
}

/* 💌 */
.message{
    padding:12px 25px;
    border-radius:50px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    font-size:clamp(16px,3.5vw,28px);
}

/* 📱 */
@media(max-width:480px){
.counter{gap:10px;}
.box{padding:15px;}
}

</style>
</head>

<body>

<!-- 🌹 ورود -->
<div class="fall-roses" id="roses"></div>

<!-- 💖 قلوب -->
<div class="hearts" id="hearts"></div>

<div class="container">

    <div class="logo">Basbosty ❤️</div>
    <div class="line"></div>

    <div class="title">
        من يوم 25/3/2026 <br>
        وإلى مالا نهاية ♾️
    </div>

    <div class="subtitle">❤️ كل ثانية بتقربني ليكي أكتر ❤️</div>

    <div class="counter">

        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">أيام</div>
        </div>

        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">ساعات</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">دقائق</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">ثواني</div>
        </div>

    </div>

    <div class="message">
        كل يوم بيزيد حبي ليكي أكتر من اللي قبله 💖
    </div>

</div>

<script>

/* ⏳ العداد */
const startDate = new Date("2026-03-25T00:00:00");

function updateCounter(){
    let now = new Date();
    let diff = now - startDate;
    if(diff < 0) diff = 0;

    document.getElementById("days").innerText =
    Math.floor(diff / (1000*60*60*24));

    document.getElementById("hours").innerText =
    Math.floor((diff % (1000*60*60*24)) / (1000*60*60));

    document.getElementById("minutes").innerText =
    Math.floor((diff % (1000*60*60)) / (1000*60));

    document.getElementById("seconds").innerText =
    Math.floor((diff % (1000*60)) / 1000);
}

setInterval(updateCounter,1000);
updateCounter();

/* 💖 قلوب */
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (Math.random()*20 + 10) + "px";
    heart.style.animationDuration = (Math.random()*6 + 4) + "s";

    document.getElementById("hearts").appendChild(heart);

    setTimeout(()=>heart.remove(),10000);
}

setInterval(createHeart,200);

/* 🌹 ورود ساقطة */
function createRose(){
    const rose = document.createElement("div");
    rose.classList.add("rose");
    rose.innerHTML = "🌹";

    rose.style.left = Math.random()*100 + "vw";
    rose.style.fontSize = (Math.random()*20 + 15) + "px";
    rose.style.animationDuration = (Math.random()*5 + 5) + "s";

    document.getElementById("roses").appendChild(rose);

    setTimeout(()=>rose.remove(),10000);
}

setInterval(createRose,400);

</script>

</body>
</html>
